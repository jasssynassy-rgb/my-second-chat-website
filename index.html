<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Room Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d1b3d 0%, #4a1a2c 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #login-screen {
            background: rgba(45, 27, 61, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 2px solid #7b3f8f;
        }

        #login-screen h1 {
            color: #b084cc;
            margin-bottom: 20px;
        }

        #login-screen input {
            padding: 12px;
            width: 250px;
            border: 2px solid #7b3f8f;
            border-radius: 8px;
            background: #1a0f24;
            color: #e0e0e0;
            font-size: 16px;
            margin-bottom: 15px;
        }

        #login-screen button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #7b3f8f 0%, #8b2f5f 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #login-screen button:hover {
            background: linear-gradient(135deg, #8b4f9f 0%, #9b3f6f 100%);
        }

        #chat-app {
            display: none;
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: rgba(26, 15, 36, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 2px solid #7b3f8f;
        }

        #app-header {
            background: linear-gradient(135deg, #4a1a2c 0%, #2d1b3d 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #7b3f8f;
        }

        #app-header h1 {
            color: #b084cc;
        }

        #app-header p {
            color: #9b7fb8;
            margin-top: 5px;
        }

        #main-container {
            display: flex;
            height: calc(100% - 80px);
        }

        #sidebar {
            width: 280px;
            background: rgba(45, 27, 61, 0.8);
            border-right: 2px solid #7b3f8f;
            display: flex;
            flex-direction: column;
        }

        #sidebar-header {
            padding: 20px;
            background: #2d1b3d;
            border-bottom: 2px solid #7b3f8f;
        }

        #sidebar-header h2 {
            color: #b084cc;
            margin-bottom: 15px;
            font-size: 18px;
        }

        #new-room-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #7b3f8f;
            border-radius: 6px;
            background: #1a0f24;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        #create-room-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #7b3f8f 0%, #8b2f5f 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #create-room-btn:hover {
            background: linear-gradient(135deg, #8b4f9f 0%, #9b3f6f 100%);
        }

        #room-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .room-item {
            padding: 15px;
            margin-bottom: 8px;
            background: rgba(74, 26, 44, 0.6);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .room-item:hover {
            background: rgba(74, 26, 44, 0.9);
            border-color: #7b3f8f;
        }

        .room-item.active {
            background: linear-gradient(135deg, #7b3f8f 0%, #8b2f5f 100%);
            border-color: #b084cc;
        }

        .room-item h3 {
            color: #e0e0e0;
            font-size: 16px;
        }

        .room-item p {
            color: #9b7fb8;
            font-size: 12px;
            margin-top: 5px;
        }

        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chat-header {
            padding: 20px;
            background: #2d1b3d;
            border-bottom: 2px solid #7b3f8f;
        }

        #chat-header h2 {
            color: #b084cc;
        }

        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(26, 15, 36, 0.6);
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(74, 26, 44, 0.5);
            border-radius: 10px;
            border-left: 4px solid #7b3f8f;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .message-sender {
            color: #b084cc;
            font-weight: bold;
        }

        .message-time {
            color: #9b7fb8;
            font-size: 12px;
        }

        .message-text {
            color: #e0e0e0;
            margin-bottom: 5px;
        }

        .message-status {
            color: #7b3f8f;
            font-size: 11px;
            text-align: right;
        }

        .message-status.read {
            color: #b084cc;
        }

        #input-container {
            padding: 20px;
            background: #2d1b3d;
            border-top: 2px solid #7b3f8f;
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #7b3f8f;
            border-radius: 8px;
            background: #1a0f24;
            color: #e0e0e0;
            font-size: 14px;
        }

        #send-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #7b3f8f 0%, #8b2f5f 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #send-btn:hover {
            background: linear-gradient(135deg, #8b4f9f 0%, #9b3f6f 100%);
        }

        .empty-state {
            text-align: center;
            color: #9b7fb8;
            padding: 40px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a0f24;
        }

        ::-webkit-scrollbar-thumb {
            background: #7b3f8f;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #8b4f9f;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <h1>Welcome to Multi-Room Chat</h1>
        <p style="color: #9b7fb8; margin-bottom: 20px;">Enter your name to get started</p>
        <input type="text" id="username-input" placeholder="Enter your name" maxlength="20">
        <br>
        <button onclick="login()">Join Chat</button>
    </div>

    <!-- Chat App -->
    <div id="chat-app">
        <div id="app-header">
            <h1>Multi-Room Chat</h1>
            <p>Logged in as: <span id="current-user"></span></p>
        </div>
        <div id="main-container">
            <!-- Sidebar -->
            <div id="sidebar">
                <div id="sidebar-header">
                    <h2>Chat Rooms</h2>
                    <input type="text" id="new-room-input" placeholder="New room name" maxlength="30">
                    <button id="create-room-btn" onclick="createRoom()">Create Room</button>
                </div>
                <div id="room-list"></div>
            </div>

            <!-- Chat Container -->
            <div id="chat-container">
                <div id="chat-header">
                    <h2 id="current-room-name">Select a room</h2>
                </div>
                <div id="messages-container">
                    <div class="empty-state">
                        <h3>No room selected</h3>
                        <p>Create or select a chat room to start messaging</p>
                    </div>
                </div>
                <div id="input-container">
                    <input type="text" id="message-input" placeholder="Type your message..." disabled>
                    <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentUser = '';
        let currentRoomId = null;
        let rooms = {};
        let messageIdCounter = 0;

        // Login function
        function login() {
            const username = document.getElementById('username-input').value.trim();
            if (username === '') {
                alert('Please enter your name!');
                return;
            }
            currentUser = username;
            document.getElementById('current-user').textContent = username;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'block';
            
            // Create a default room
            createRoom('General');
        }

        // Create a new room
        function createRoom(roomName = null) {
            const roomInput = document.getElementById('new-room-input');
            const name = roomName || roomInput.value.trim();
            
            if (name === '') {
                alert('Please enter a room name!');
                return;
            }

            const roomId = 'room_' + Date.now();
            rooms[roomId] = {
                name: name,
                messages: [],
                members: [currentUser]
            };

            roomInput.value = '';
            renderRoomList();
            switchRoom(roomId);
        }

        // Render the list of rooms
        function renderRoomList() {
            const roomList = document.getElementById('room-list');
            roomList.innerHTML = '';

            for (const roomId in rooms) {
                const room = rooms[roomId];
                const roomItem = document.createElement('div');
                roomItem.className = 'room-item';
                if (roomId === currentRoomId) {
                    roomItem.classList.add('active');
                }
                
                roomItem.innerHTML = `
                    <h3>${room.name}</h3>
                    <p>${room.messages.length} messages</p>
                `;
                
                roomItem.onclick = () => switchRoom(roomId);
                roomList.appendChild(roomItem);
            }
        }

        // Switch to a different room
        function switchRoom(roomId) {
            // Mark all messages in previous room as read
            if (currentRoomId && rooms[currentRoomId]) {
                rooms[currentRoomId].messages.forEach(msg => {
                    if (msg.sender !== currentUser) {
                        msg.read = true;
                    }
                });
            }

            currentRoomId = roomId;
            
            // Add user to room if not already there
            if (!rooms[roomId].members.includes(currentUser)) {
                rooms[roomId].members.push(currentUser);
            }

            document.getElementById('current-room-name').textContent = rooms[roomId].name;
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            
            renderMessages();
            renderRoomList();

            // Mark messages as read after switching
            setTimeout(() => {
                rooms[currentRoomId].messages.forEach(msg => {
                    if (msg.sender !== currentUser) {
                        msg.read = true;
                    }
                });
                renderMessages();
            }, 1000);
        }

        // Render messages in current room
        function renderMessages() {
            const container = document.getElementById('messages-container');
            
            if (!currentRoomId || rooms[currentRoomId].messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No messages yet</h3>
                        <p>Be the first to send a message in this room!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            rooms[currentRoomId].messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                
                const statusText = msg.sender === currentUser 
                    ? (msg.read ? 'Read' : 'Sent') 
                    : '';
                const statusClass = msg.read ? 'read' : '';
                
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span class="message-sender">${msg.sender}</span>
                        <span class="message-time">${msg.time}</span>
                    </div>
                    <div class="message-text">${msg.text}</div>
                    ${status
